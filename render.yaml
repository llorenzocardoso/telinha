services:
  - type: web
    name: telinha-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MIN_PROTOCOL_VERSION
        value: "2"
      - key: MIN_APP_VERSION
        value: "0.4.0"
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Sem "value": o Blueprint não deve sobrescrever o que estiver no painel.
      - key: TURN_ENABLED
        sync: false
      - key: TURN_MAX_BITRATE_KBPS
        sync: false
