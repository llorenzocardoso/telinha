[package]
name = "telinha"
version = "0.4.0"
description = "Aplicativo de compartilhamento de tela P2P para Windows"
authors = ["llorenzocardoso"]
license = "MIT"
repository = "https://github.com/llorenzocardoso/telinha"
homepage = "https://github.com/llorenzocardoso/telinha"
edition = "2021"

[lib]
name = "telinha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
discord-rich-presence = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wasapi = "0.19"
webview2-com = "0.39"
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
