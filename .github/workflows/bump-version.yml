name: Bump version

# A cada push na main (merge de PR) sobe a versão do app e do servidor e faz o commit
# "chore: bump version to X" direto na main, como era feito à mão.
#
# Nível: patch por padrão. Escreva [minor] ou [major] no título do PR; [skip bump] pula.
# Só o título conta, então o corpo dos commits pode citar essas marcas sem efeito.
# Também roda na mão: Actions → Bump version → Run workflow.
#
# O push usa a deploy key do segredo BUMP_DEPLOY_KEY: o ruleset da main exige PR, e em
# repositório pessoal o GitHub não aceita o app do GitHub Actions no bypass, só deploy keys.
# Ver "Bump automático" em docs/operations.md.
#
# Push por deploy key dispara workflows (a CI roda na versão nova). Este aqui ignora o
# próprio commit "chore: bump version", então não entra em loop.

on:
  workflow_dispatch:
    inputs:
      level:
        description: patch, minor, major ou X.Y.Z
        required: true
        default: patch
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".specs/**"
      - "spike/**"
      - "e2e/**"
      - ".github/**"
      - "LICENSE"

permissions:
  # O push sai pela deploy key; o GITHUB_TOKEN só lê.
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - name: Check the deploy key
        env:
          KEY: ${{ secrets.BUMP_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Falta o segredo BUMP_DEPLOY_KEY (ver docs/operations.md, Bump automático)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.BUMP_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choose the bump level
        id: level
        env:
          # Textos vão por variável de ambiente, nunca interpolados no script.
          MANUAL_LEVEL: ${{ inputs.level }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$MANUAL_LEVEL" ]; then
            if ! grep -qE '^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+)$' <<<"$MANUAL_LEVEL"; then
              echo "::error::Nível inválido: $MANUAL_LEVEL"
              exit 1
            fi
            echo "level=$MANUAL_LEVEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Só o título do PR conta: no merge ele é a 3ª linha da mensagem; fora de merge,
          # o assunto do commit. O corpo pode citar as marcas sem efeito.
          SUBJECT=$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)
          if [[ "$SUBJECT" == "Merge pull request"* ]]; then
            TITLE=$(printf '%s\n' "$HEAD_MESSAGE" | sed -n '3p')
          else
            TITLE=$SUBJECT
          fi
          echo "Título considerado: $TITLE"
          TITLE=${TITLE,,}
          if [[ "$TITLE" == *"[skip bump]"* ]]; then
            echo "level=skip" >> "$GITHUB_OUTPUT"
          elif [[ "$TITLE" == *"[major]"* ]]; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif [[ "$TITLE" == *"[minor]"* ]]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump
        id: bump
        if: steps.level.outputs.level != 'skip'
        run: node scripts/bump-version.mjs "${{ steps.level.outputs.level }}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.level.outputs.level != 'skip'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${VERSION}"
          # Alguém pode ter feito push no meio: rebase e tenta de novo.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Versão ${VERSION} na main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
