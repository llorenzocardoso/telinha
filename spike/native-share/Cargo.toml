[package]
name = "native-share-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of the app build or CI.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
libwebrtc = "0.3.52"
log = "0.4.34"
rand = "0.9"
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tokio = { version = "1.53.3", features = ["full"] }
webrtc = "0.21.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Media_DirectShow",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]
